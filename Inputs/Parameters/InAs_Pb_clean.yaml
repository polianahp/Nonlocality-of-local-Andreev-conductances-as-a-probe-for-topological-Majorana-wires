acceleration_type: "parallel"
hamiltonian_mode: "legacy"

outputs:
  dirname: "InAs_Pb_Clean"

simulation:
  default: "simulation/sim_default.yaml"

  disorder:
    is_real_space: True
    disorder_dirname: clean_350.npy
    realization_index: 0
    lambda_dis: 4.5
    V0: 0.0

  geometry:
    default: "InAs-Pb-3.5micron.yaml"

  barrier_calibration:
    default: "barrier_calibration_pb.yaml"
    target_gns: [0.25, 0.35, 0.45, 0.55, 0.65]
    tgp_barrier_pairs:
      - [10.4223, 10.4223]
      - [8.7618, 8.7618]
      - [7.6256, 7.6256]
      - [6.7115, 6.7115]
      - [5.8858, 5.8858]

  resolution:
    quadrature_nodes_25: 51
    barrier_quadrature_nodes: 8
    temperatures: [0.0, 40.0]

    asym_points: 20
    barrier_conductance_mode: "finite_temperature"
    barrier_T_mK: 0.0
    barrier_u_min: -5.0
    barrier_u_max: 15.0
    barrier_u_points: 20

    mu_max: 2.0
    mu_min: 0.0
    mu_dist: 0.05

    Vz_max: 2.5
    Vz_min: 0.0
    Vz_dist: 0.05

    num_engs: 51
    num_eigenvalues: 12
    eng_window_range: 51
    weight_threshold: 0.8
    separation_threshold: 0.65

calculation_includes:
  calc_25_cutter_harmonics: False
  conductance_flag: False
  spectra_flag: True
  localization_flag: True
  pdi_flag: False
  calc_pfaffian: True
  pfaffian_delta_N: 0
  calc_barrier_sweeps: False
  barrier_sweep_only: False
  multi_baseline_barriers: False
  barrier_sweep_indices: null

protocol:
  default: "protocol/protocol_default.yaml"
