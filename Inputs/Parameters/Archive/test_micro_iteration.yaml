acceleration_type: "serial"
num_workers: 1
hamiltonian_mode: "legacy"
outputs:
  dirname: "scratch/test_pipeline_micro"

simulation:
  disorder:
    is_real_space: False
    disorder_fpath: "Fourier_Component_Disorders/fourier_disorder_2.npy"
    lambda_dis: 4.5
    V0: 1.2
    
  geometry:
    default: "geometry/InAs-3micron.yaml"
  
  barrier_calibration:
    default: "barrier_calibration/barrier_calibration.yaml"

  resolution:
    mu_min: 1.0
    mu_max: 1.05
    mu_dist: 0.05
    Vz_min: 0.5
    Vz_max: 0.55
    Vz_dist: 0.05
    temperatures: [40.0]
    num_engs: 11
    num_eigenvalues: 4
    weight_threshold: 0.05
    separation_threshold: 10
    barrier_quadrature_nodes: 8

calculation_includes:
  spectra: True
  localization: True
  barrier_sweep: False
  tgp_stage1: True
  tgp_stage2: True
  stage2_fullgrid: True
  pfaffian: True
  save_old_data_format: True

protocol:
  default: "protocol/protocol_default.yaml"
  tgp:
    default: "protocol/tgp_default.yaml"
    stage1:
      num_cutters: 3
      gn_min: 0.05
      gn_max: 0.65
      num_mu_calib_points: 5
    stage2:
      num_cutters: 3
      target_gns: [0.35, 0.49, 0.62]
      compensate_per_mu: True
