# ==============================================================================
# Tdispfaff5_exact_calibrated.yaml
# Production Configuration for Exact Energy-Dependent Self-Energy Hamiltonian
# with Automated Normal-State Barrier Calibration (Aghaee et al. 2023)
# ==============================================================================

# Disorder Management
dirname: "Tdispfaff5_exact_calibrated"
fname: "Tdis.npz"
V0: 1.2

# Geometry and Physics
Ls: 300
Ln: 0
Lb: 3
Lb_pdi: 3
a0: 100.0
ms: 0.023
Delta_0: 0.3
gamma: 0.2
barrier0: 2.0
mu_n: 0.0
qn: 20

# Exact Energy-Dependent Self-Energy Solver Mode
hamiltonian_mode: "exact"

# Barrier Calibration Settings (Inverts G_N(U_c) = G_target at E = 0.5 meV, V_z = 0)
calibrate_barriers: True
target_gns: [0.35, 0.49, 0.62, 0.76, 0.90]

# Sweep Ranges (Full Production Grid: 225 x 70 = 15,750 points)
mu_max: 4.5
mu_min: 0.0
mu_dist: 0.02

Vz_max: 1.4
Vz_min: 0.0
Vz_dist: 0.02

# Simulation Resolution
Upoints: 101
num_engs: 51
num_eigenvalues: 12
eng_window_range: 51
weight_threshold: 0.8
separation_threshold: 0.65

# Execution and Observables
acceleration_type: "parallel"
conductance_flag: True
spectra_flag: True
localization_flag: True
pdi_flag: True
calc_pfaffian: True
pfaffian_delta_N: 0

# Barrier Sweep Mode (Zero-temperature conductance at E = 0.0)
barrier_conductance_mode: "zero_temperature"
