# ==============================================================================
# dense_u_calibrated_r1.yaml
# Production Configuration for Calibrated Dense-U Multi-Temperature Suite
# Disorder Realization 1 (Harpers Ferry Production Run)
# ==============================================================================

# Disorder Management
dirname: "Harpers_Ferry/Dense_U_Calibrated/Realization_1"
realization_index: 1
lambda_dis: 4.5
V0: 1.2

# Geometry and Physics
Ls: 300
Ln: 0
Lb: 3
Lb_pdi: 3
a0: 100.0
ms: 0.023
Delta_0: 0.3
gamma: 0.2
barrier0: 2.0
mu_n: 0.0
qn: 20

# Barrier Calibration Settings (Aghaee et al. 2023)
calibrate_barriers: True
target_gns: [0.35, 0.49, 0.62, 0.76, 0.90]

# Dense Barrier U-Sweep Configuration (100 points in [-5, +5] meV)
barrier_u_min: -5.0
barrier_u_max: 5.0
barrier_u_points: 100
multi_baseline_barriers: True

# 25-Cutter Harmonics (1w, 2w, 3w via Double-Exponential Quadrature)
calc_25_cutter_harmonics: True
quadrature_nodes_25: 51

# Thermal Broadening Suite
barrier_conductance_mode: "finite_temperature"
barrier_T_mK_list: [0.0, 10.0, 20.0, 30.0, 40.0]
barrier_quadrature_nodes: 8

# Sweep Ranges (Full Production Grid: 225 x 70 = 15,750 points)
mu_max: 4.5
mu_min: 0.0
mu_dist: 0.02

Vz_max: 1.4
Vz_min: 0.0
Vz_dist: 0.02

# Simulation Resolution
Upoints: 100
num_engs: 51
num_eigenvalues: 12
eng_window_range: 51
weight_threshold: 0.8
separation_threshold: 0.65

# Execution and Observables
acceleration_type: "parallel"
conductance_flag: True
spectra_flag: True
localization_flag: True
pdi_flag: True
calc_pfaffian: True
pfaffian_delta_N: 0
