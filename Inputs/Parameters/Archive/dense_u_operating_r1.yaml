# ==============================================================================
# dense_u_operating_r1.yaml
# Tier 2 Production Configuration: 25-Cutter Harmonics (0 & 40 mK) - Delta Only
# Evaluates full 5x5 = 25 asymmetric cutter gate pairs via 51-node Double-Exponential
# quadrature at base (0 mK) and operational (40 mK) temperatures.
# Redundant barrier sweeps omitted (already computed in Tier 1).
# Disorder Realization 1 (Harpers Ferry Production Run: ~49 minutes on 255 workers)
# ==============================================================================

# Disorder Management
dirname: "Harpers_Ferry/Dense_U_Operating/Realization_1"
realization_index: 1
lambda_dis: 4.5
V0: 1.2

# Geometry and Physics
Ls: 300
Ln: 0
Lb: 3
Lb_pdi: 3
a0: 100.0
ms: 0.023
Delta_0: 0.3
gamma: 0.2
barrier0: 2.0
mu_n: 0.0
qn: 20

# Barrier Calibration Settings (All 5 Target Conductances for 25 Cutters)
calibrate_barriers: True
target_gns: [0.25, 0.35, 0.45, 0.55, 0.65]
tgp_barrier_pairs:
  - [3.70166, 0.51688]
  - [2.72414, -0.49467]
  - [2.02246, -1.23079]
  - [1.47386, -1.81453]
  - [1.02083, -2.30388]

# Barrier Sweeps: Disabled (Option A: Delta-Only, already in Tier 1)
calc_barrier_sweeps: False
multi_baseline_barriers: False

# 25-Cutter Harmonics (1w, 2w, 3w via 51-node Double-Exponential Quadrature)
calc_25_cutter_harmonics: True
quadrature_nodes_25: 51

# Thermal Broadening Suite (Operating Temperatures: 0 and 40 mK)
barrier_conductance_mode: "finite_temperature"
barrier_T_mK_list: [0.0, 40.0]
barrier_quadrature_nodes: 8

# Sweep Ranges (Full Production Grid: 225 x 70 = 15,750 points)
mu_max: 4.5
mu_min: 0.0
mu_dist: 0.02

Vz_max: 1.4
Vz_min: 0.0
Vz_dist: 0.02

# Simulation Resolution
num_engs: 51
num_eigenvalues: 12
eng_window_range: 51
weight_threshold: 0.8
separation_threshold: 0.65

# Execution and Observables
acceleration_type: "parallel"
conductance_flag: False
spectra_flag: True
localization_flag: True
pdi_flag: True
calc_pfaffian: True
pfaffian_delta_N: 0
