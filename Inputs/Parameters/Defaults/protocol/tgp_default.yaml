# =============================================================================
# Canonical Azure Quantum TGP Parameters (Simulation & Post-Processing)
# Replicating exact values from azure-quantum-tgp on GitHub:
# - tgp/one.py, tgp/two.py, and notebooks/yield_analysis.py
# Note: Physical simulation temperatures are configured in resolution.temperatures
# so that both Stage 1 and Stage 2 are evaluated at consistent temperatures.
# =============================================================================

# --- Stage 1: Zero-Bias Harmonics & Gapless Identification ---
stage1:
  # Simulation Settings (main_parallel.py)
  num_cutters: 21
  gn_min: 0.01
  gn_max: 0.85
  num_mu_calib_points: 61
  pairing_seed: 42
  # Quadrature methods are used because they are significantly faster than dense bias-grid
  # filtering and converge to the same result with enough nodes. Typically we use 16 nodes
  # for "legendre" and 51 nodes for "double_exponential".
  quadrature_method: "legendre"
  quadrature_nodes: 16
  
  # Noise-Floor Detection (tgp.one.set_2w_th)
  n_tiles: 100                 # Number of tiles for automatic 2w noise-floor detection
  percentile: 33               # Bottom percentile of tile noise levels
  th_2w: null                  # Explicit 2w threshold override (if null, auto-calculated)
  B_max: null                  # Upper B bound for "known trivial" noise region
  V_max: null                  # Upper V bound for "known trivial" noise region
  
  # Gapless & Gap-Closing Thresholds (tgp.one.set_gapped & set_3w_th)
  th_2w_p: 0.50                # Fraction of cutter pairs exceeding 2w noise floor
  th_3w: 1.0e3                 # Curvature threshold (1000.0) for gap-closing detection
  th_3w_tat: 0.70              # Fraction of cutter pairs independently detecting 3w gap-closing
  zbp_cutter_fraction_th: 0.70 # Fraction of cutters (>= 15/21) required for Stage 1 ROI1
  
  # Bounding Box Search (tgp.common.cluster_infos)
  roi1_pct_box: 10             # Minimal percentage distance around ROI1 clusters
  roi1_min_margin_box: [0.003, 0.2]  # [V_margin, B_margin]

# --- Stage 2: Compensated Cutters & Finite-Bias Transport Spectroscopy ---
stage2:
  # Simulation Settings (main_parallel.py)
  num_cutters: 5
  target_gns: [0.35, 0.49, 0.62, 0.76, 0.90]  # MSFT simulation targets (e^2/h)
  compensate_per_mu: True      # Calibrate (U_L(mu), U_R(mu)) per chemical potential
  B_max_stage2: null           # Upper B truncation bound (if null, inferred from ROI1)
  
  # Transport Gap Extraction (tgp.two.extract_gap)
  gap_threshold_factor: 0.05   # G_th = 0.05 * max(G_NL) for disordered wires
  noise_threshold: 1.0e-4      # Conductance floor in e^2/h
  upper_conductance_threshold: null  # null means infinity (no clamping of max|G_NL|)
  
  # Zero-Bias Peak Detection (tgp.two.zbp_dataset_derivative)
  bias_window: 0.007           # Bias window (meV) around zero for ZBP analysis
  derivative_threshold: 100.0  # Min magnitude of 2nd derivative of G_loc at zero bias
  average_over_cutter: False   # Whether to average ZBP detection across cutters
  zbp_cutter_fraction_th: 0.60 # Fraction of cutter pairs (>= 3/5) detecting ZBP
  
  # Pixel-Level Gap Filtering (tgp.two.set_gap_threshold)
  threshold_low: 0.005         # Min extracted gap (5 ueV) to be marked gapped
  threshold_high: 0.067        # Max extracted gap (0.067 meV) to reject parent gap
  
  # Cluster Scoring & Topological Validation (tgp.two.cluster_and_score)
  min_cluster_size: 7          # Min pixels for OPTICS cluster to be valid
  cluster_gap_threshold: 0.005 # Min median gap (5 ueV) across cluster
  gapless_boundary_th: 0.60    # Min fraction (60%) of cluster boundary touching 3w gapless points
  cutter_overlap_th: 0.50      # Min fraction (>= 3/5) of cutters with overlapping SOI2
