# ==============================================================================
# barrier_calibration.yaml
# Default parameters for simultaneous nanowire cutter calibration (Aghaee 2023)
# Solves for the symmetric barrier pair (UL, UR) yielding target G_N on each lead.
# ==============================================================================

# Target normal-state differential conductances G_N in units of e^2/h for the 5 cutter gates
# Each target defines a symmetric operating configuration [G_N, [UL, UR]]


#mainly for testing. determines if SimulationState will do calibration. 
calibrate_cutters: False

# barriers used for 3w measurement with symmetric barriers (Microsoft azure-quantum-tgp 5 cutters)
# These will override G_ns in the calibration sweep array that are within +- 0.01 e^2/h
symmetric_target_gns: [0.35, 0.49, 0.62, 0.76, 0.90]


#calibration range for barrier sweep
sweep_gnmin: 0.01
sweep_gnmax: 0.85
sweep_gnres: 0.042


# Above-gap bias energy in meV (E > Delta_0) where Andreev reflection is suppressed
# Isolates normal-state electron transmission into the proximitized wire
energy: 0.5

# Convergence tolerance on cutter potential in meV for Brent's method (brentq)
tol: 1e-4

# Maximum solver iterations allowed for root finding
max_iter: 50

# Subband chemical potential sampling window in meV for median-averaging
# Evaluates equidistant chemical potentials spanning the lowest subband
n_mu_points: 15
mu_min: 0.0
mu_max: 2.0

# Numerical bracket limits for cutter potential root finding in meV
# [-20.0, 35.0] spans the disorder-shifted open-barrier peak regime to pinch-off
u_min: -50
u_max: 50.0
