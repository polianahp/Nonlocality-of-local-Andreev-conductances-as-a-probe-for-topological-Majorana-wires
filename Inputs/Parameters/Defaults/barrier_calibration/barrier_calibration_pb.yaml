# ==============================================================================
# barrier_calibration_pb.yaml
# Default parameters for simultaneous nanowire cutter calibration on Pb platform
# (Delta_0 = 1.3 meV, Aghaee et al. arXiv:2606.03884v1)
# ==============================================================================

calibrate_cutters: False
symmetric_target_gns: [0.25, 0.35, 0.45, 0.55, 0.65]
sweep_gnmin: 0.01
sweep_gnmax: 0.85
sweep_gnres: 0.042

# Root search bracket boundaries for cutter gate potentials in meV
u_min: -20.0
u_max: 35.0

# Above-gap bias energy in meV (E > Delta_0 = 1.3 meV) where Andreev reflection is suppressed
energy: 2.0

# Convergence tolerance on cutter potential in meV for Brent's method (brentq)
tol: 1e-4

# Maximum solver iterations allowed for root finding
max_iter: 50

# Subband chemical potential sampling window in meV for median-averaging
n_mu_points: 15
mu_min: 0.0
mu_max: 2.0
