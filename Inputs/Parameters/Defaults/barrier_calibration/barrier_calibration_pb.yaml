# ==============================================================================
# barrier_calibration_pb.yaml
# Default parameters for simultaneous nanowire cutter calibration on Pb platform
# (Delta_0 = 1.3 meV, Aghaee et al. arXiv:2606.03884v1)
# ==============================================================================

calibrate_cutters: False
sweep_gnmin: 0.01
sweep_gnmax: 0.85
sweep_gnres: 0.042

# Root search bracket boundaries for cutter gate potentials in meV
u_min: -20.0
u_max: 100.0

# Pre-health check pinch-off tolerance in e^2/h at U = u_max
pinch_off_tol: 1.0e-3

# Peak conductance search parameters in meV (find U_top and G_max starting inward from large repulsive U)
peak_search_start_u: 10.0
peak_search_step: 0.1

# Stage 2 conductance target parameters in e^2/h
stage2_target_Gns: [0.25, 0.35, 0.45, 0.55, 0.65]
stage2_gn_min: 0.01
stage2_min_gn_spacing: 0.045

# Stationary baseline selection for barrier sweeps:
# - "highest": largest calibrated target conductance available (target_GNs[-1])
# - "three_point": [lowest, middle, highest] calibrated target conductances
sweep_baseline_mode: "highest"

# Above-gap bias energy in meV (E > Delta_0 = 1.3 meV) where Andreev reflection is suppressed
energy: 2.0

# Convergence tolerance on cutter potential in meV for Brent's method (brentq)
tol: 1e-4

# Maximum solver iterations allowed for root finding
max_iter: 50

# Subband chemical potential sampling window in meV for median-averaging
n_mu_points: 61
mu_min: 0.0
mu_max: 2.0
