
acceleration_type: "parallel"
hamiltonian_mode: "legacy"

outputs:
  dirname: "Dense_U_Operating/Realization_0"

simulation:
  default: "simulation/sim_default.yaml"

  disorder:
    is_real_space: False
    disorder_dirname: Fourier_Component_Disorders/fourier_disorder_0.npy
    realization_index: 0
    lambda_dis: 4.5
    V0: 1.2
    
  geometry:
    default: "InAs-3micron.yaml"

  barrier_calibration:
    default: "barrier_calibration.yaml"
    target_gns: [0.25, 0.35, 0.45, 0.55, 0.65]
    tgp_barrier_pairs:
      - [2.71906, 3.05435]
      - [1.90376, 2.16704]
      - [1.32122, 1.53203]
      - [0.57238, 1.03654]
      - [-0.12125, 0.62787]

  resolution:
    quadrature_nodes_25: 51
    barrier_quadrature_nodes: 8
    temperatures: [0.0, 40.0]

    asym_points: 20
    barrier_conductance_mode: "finite_temperature"
    barrier_T_mK: 0.0
    barrier_u_min: -5.0
    barrier_u_max: 5.0
    barrier_u_points: 20

    mu_max: 4.5
    mu_min: 0.0
    mu_dist: 0.02

    Vz_max: 1.4
    Vz_min: 0.0
    Vz_dist: 0.02

    num_engs: 51
    num_eigenvalues: 12
    eng_window_range: 51
    weight_threshold: 0.8
    separation_threshold: 0.65

calculation_includes:
  calc_25_cutter_harmonics: True
  conductance_flag: False
  spectra_flag: True
  localization_flag: True
  pdi_flag: True
  calc_pfaffian: True
  pfaffian_delta_N: 0
  calc_barrier_sweeps: False
  barrier_sweep_only: False
  multi_baseline_barriers: False
  barrier_sweep_indices: null

protocol:
  default: "protocol/protocol_default.yaml"
