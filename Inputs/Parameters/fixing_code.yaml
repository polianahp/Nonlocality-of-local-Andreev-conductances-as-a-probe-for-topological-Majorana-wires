

acceleration_type: "parallel"
num_workers: -1
hamiltonian_mode: "legacy"
outputs:
  dirname: "Dense_U_Operating/Realization_2"

simulation:

  disorder:
    is_real_space: False #if not real space, data array at disorder_dirname is a set of fourier components
    disorder_fpath: Fourier_Component_Disorders/fourier_disorder_2.npy
    lambda_dis: 4.5
    V0: 1.2
    
  geometry:
    default: "geometry/InAs-3micron.yaml"
  
  barrier_calibration:
    default: "barrier_calibration/barrier_calibration.yaml"

  resolution:
    default: "resolution/resolution_test.yaml"

calculation_includes:
  spectra: True
  localization: True
  barrier_sweep: True
  tgp_stage1: True
  tgp_stage2: False
  stage2_fullgrid: False
  pfaffian: True
  save_old_data_format: False


protocol:
  default: "protocol/protocol_default.yaml"
  tgp:
    default: "protocol/tgp_default.yaml"
