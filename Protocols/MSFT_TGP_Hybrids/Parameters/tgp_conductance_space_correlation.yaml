      fpe_conductance_space_corr.corr_threshold: 0.90
      fpe_conductance_space_corr.baseline_gn: 0.55

  # ==============================================================================
  # 4. Dyad Hybrids: Conductance-Space Correlation + Lead Symmetry Balance
  # ==============================================================================
  - instance_name: "tgp_bnd060_condcorr_R080_sym020"
    parameters:
      tgp_base.boundary_pct_threshold: 0.60
      fpe_conductance_space_corr.enabled: true
      fpe_conductance_space_corr.lead: "R"
      fpe_conductance_space_corr.corr_threshold: 0.80
      fpe_conductance_space_corr.baseline_gn: 0.55
      fpe_lead_symmetry_balance.enabled: true
      fpe_lead_symmetry_balance.s_max: 0.20

  - instance_name: "tgp_bnd060_condcorr_minLR080_sym020"
    parameters:
